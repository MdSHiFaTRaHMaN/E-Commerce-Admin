<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Shifatdevs Admin</title>
  <meta name="description"
    content="The back office for Shifatdevs, the striped-shirt shop: sales, an order board you drag from New to Delivered, stock and prices by size, customers, fit insights from the size finder and discount codes. Light and dark." />
  <meta name="theme-color" content="#e4ecea" />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400..700&display=swap" rel="stylesheet" />
  <script>
    /* Before first paint: the saved theme, so the page never flashes the wrong
       colours; the shell is hidden until React has drawn it (failsafe at 4s). */
    (function (d) {
      d.classList.add('js');
      try {
        if (!/[?&]record\b/.test(location.search)) {
          var a = JSON.parse(localStorage.getItem('raye:admin:v1') || 'null');
          if (a && a.theme) d.dataset.theme = a.theme;
        }
      } catch (e) { }
      setTimeout(function () { d.classList.add('failsafe'); }, 4000);
    })(document.documentElement);
  </script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="module" crossorigin src="/assets/index-gXshZJT2.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DtBs7I6o.css">
</head>

    <p style="padding:24px">The Shifatdevs admin needs JavaScript to run.</p>

</body>
